<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Deposit money into your Nexus Bank account quickly and securely.">
    <title>Deposit Money - Nexus Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html" class="logo">🏦 Nexus Bank</a>
        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
            <button id="logoutBtn" class="btn-logout">Logout</button>
        </div>
    </nav>

    <main>
        <div class="card">
            <h2>💰 Deposit Money</h2>
            <div class="balance-box" style="margin-bottom: 24px;">
                <p>Current Balance</p>
                <h3 id="displayBalance">₹ 0.00</h3>
            </div>
            
            <div id="successMsg" class="alert alert-success"></div>
            
            <form id="depositForm">
                <div class="form-group">
                    <label for="amount">Enter Amount to Deposit (₹)</label>
                    <input type="number" id="amount" placeholder="e.g. 5000">
                    <div id="amountError" class="error-message"></div>
                </div>

                <button type="submit" class="btn-primary">Deposit Now</button>
                <a href="dashboard.html" class="btn-secondary" style="margin-top: 10px; width: 100%; display: block;">← Back to Dashboard</a>
            </form>
        </div>
    </main>

    <footer>
        <p>Web Technology Lab Project - YCCE, Nagpur &copy; 2026</p>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/deposit.js"></script>
</body>
</html>
